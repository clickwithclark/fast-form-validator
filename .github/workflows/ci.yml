name: CI/CD

# When should this run?
on:
  push:
    branches: [ main ]  # Run on every push to main
  pull_request:
    branches: [ main ]  # Run on every pull request to main

jobs:
  test:
    runs-on: ubuntu-latest  # Use Ubuntu virtual machine
    
    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]  # Test on multiple Node versions
    
    steps:
    # Step 1: Get your code
    - name: Checkout code
      uses: actions/checkout@v3
    
    # Step 2: Set up Node.js
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    # Step 3: Install dependencies
    - name: Install dependencies
      run: npm ci
    
    # Step 4: Run linter
    - name: Run linter
      run: npm run lint
    
    # Step 5: Run tests
    - name: Run tests
      run: npm test
    
    # Step 6: Build
    - name: Build
      run: npm run build
    
    # Step 7: Check bundle size
    - name: Check bundle size
      run: ls -lh UMD/ffv.min.js
